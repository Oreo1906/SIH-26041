name: Bootstrap checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/verify.py --component backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          path: |
            artifacts/verification/
            backend/dist/*.whl

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - run: npm ci
        working-directory: admin-web
      - run: python scripts/verify.py --component admin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-verification
          path: |
            artifacts/verification/
            admin-web/dist/

  # Unity compilation and physical Android checks are explicitly not covered.
